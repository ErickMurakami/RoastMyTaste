# Isolated configuration: do not import the developer's .env or use real credentials.
spring:
  application:
    name: roast-my-taste-test
  mvc:
    problemdetails:
      enabled: true
  ai:
    chat:
      client:
        enabled: false
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  security:
    oauth2:
      client:
        registration:
          spotify:
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: http://127.0.0.1:8080/login/oauth2/code/spotify
            scope: user-top-read
        provider:
          spotify:
            authorization-uri: https://accounts.spotify.com/authorize
            token-uri: https://accounts.spotify.com/api/token
            user-info-uri: https://api.spotify.com/v1/me
            user-name-attribute: id
spotify:
  api:
    base-url: https://api.spotify.com/v1
roast:
  intensity: unhinged
